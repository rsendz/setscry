name: Release

# Push tags one at a time. GitHub creates no workflow run for any of them when
# several arrive in a single push, so the release quietly never happens. A tag
# that missed its run is recovered with
#
#     gh workflow run release.yml --ref v1.2
#
# rather than by moving or recreating the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# softprops/action-gh-release needs this. Without it the release step works only
# while the repository default workflow permission happens to be read-write.
permissions:
  contents: write

jobs:
  # A tag must not publish a build whose tests never ran. Mirrors ci.yml, which
  # does not trigger on tags.
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build
        run: swift build --build-tests

      # Same reason as ci.yml: without the kernels the MLX-backed tests skip
      # themselves and gate nothing.
      - name: Fetch the Metal kernels
        run: ./Scripts/fetch-mlx-metallib.sh

      - name: Test
        run: swift test --skip-build

  app:
    needs: test
    name: Build the app bundle
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # Shares a key with CI, so a release right after a green build reuses the
      # MLX objects instead of compiling them again.
      - uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      # The weights go inside the app, so they are fetched and converted once and
      # then reused. Keyed on the checkpoint the source file names.
      - uses: actions/cache@v4
        with:
          path: Build/CLIPModel
          key: ${{ runner.os }}-clip-${{ hashFiles('Sources/SetscryMLX/CLIPModelSource.swift') }}

      # The argument is a check, not an input: make-app.sh takes the version
      # from the Swift source and fails if the tag disagrees. On a manual run
      # there is no tag, so nothing is passed and the source wins.
      - name: Build Setscry.app, checking the tag matches the source
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ./Scripts/make-app.sh "${GITHUB_REF_NAME#v}"
          else
            ./Scripts/make-app.sh
          fi

      # The zip, never the .app directory: uploading a bundle re-zips it in a way
      # that drops the executable bit and flattens the metallib symlink, and the
      # result will not launch.
      - uses: actions/upload-artifact@v4
        with:
          name: Setscry-${{ github.ref_name }}
          path: dist/Setscry-*.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Setscry-*.zip
          body: |
            Unzip and drag **Setscry.app** to Applications.

            This is an unnotarized personal build, so the first launch needs one
            extra step: open it, then allow it under System Settings ▸ Privacy &
            Security, or run

                xattr -dr com.apple.quarantine /Applications/Setscry.app

            Requires macOS 15 or later on Apple silicon.
