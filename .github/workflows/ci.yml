name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # macos-26 for Xcode 26: mlx-swift's manifest is tools-version 6.3, which
    # the Swift 6.1 on macos-15 cannot read, so dependency resolution fails
    # before anything is compiled.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      # MLX compiles a large C++ target that dominates the build time, so the
      # whole build directory is cached rather than just the checkouts.
      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      # Building and testing are separate steps so a compile failure reads
      # differently from a test failure in the log.
      - name: Build
        run: swift build --build-tests

      # The kernels are fetched so the MLX-backed tests actually run. Without
      # them every one of those tests skips itself and the log still reads
      # green, which is the same as not having them. The 600 MB model download
      # the CLIP tests need stays local: those still skip here.
      - name: Fetch the Metal kernels
        run: ./Scripts/fetch-mlx-metallib.sh

      - name: Test
        run: swift test --skip-build
